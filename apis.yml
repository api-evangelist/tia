description: Tia is a women's healthcare company that operates in-person clinics and a virtual care platform,
  bringing primary care, gynecology, mental health, and wellness services into one connected care experience.
  Founded in 2017 and backed by Canaan Partners, Tia runs clinics in New York, Los Angeles, San Francisco,
  and Phoenix, offers virtual visits across multiple states, and partners with health systems. Tia is
  a consumer healthcare provider and does not publish a public developer portal, API documentation, or
  client SDKs.
